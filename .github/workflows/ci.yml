name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  config-tests:
    name: Configuration tests (without proprietary NDI SDK)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++ nlohmann-json3-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DVEYRA_BUILD_PLAYER=OFF
          -DVEYRA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
