name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  config-tests:
    name: Configuration tests (without proprietary NDI SDK)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++ nlohmann-json3-dev libsdl2-dev libsdl2-image-dev libcurl4-openssl-dev libssl-dev pkg-config

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DVEYRA_BUILD_PLAYER=OFF
          -DVEYRA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  server-tests:
    name: Local server build and tests
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install committed locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Type-check and build
        run: npm run build

      - name: Run tests
        run: npm test

  dashboard-build:
    name: Dashboard type-check and production build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Type-check and build
        run: npm run build

  deployment-script-checks:
    name: Deployment script syntax
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n scripts/install-kiosk-debian.sh
          bash -n scripts/uninstall-kiosk-debian.sh
          bash -n scripts/ndiview-kiosk-session
          bash -n scripts/ndiview-action
          bash -n scripts/package-receiver-release.sh
          bash -n tests/test_receiver_release_package.sh
          bash tests/test_receiver_release_package.sh
                    bash -n scripts/package-server-release.sh
          bash -n scripts/install-server-release.sh
          bash -n scripts/rollback-server-release.sh
