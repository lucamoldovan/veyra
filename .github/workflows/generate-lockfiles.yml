name: Generate dependency lockfiles

on:
  push:
    branches: [main]
    paths:
      - "server/package.json"
      - "dashboard/package.json"
      - ".github/workflows/generate-lockfiles.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veyra-lockfiles
  cancel-in-progress: false

jobs:
  lockfiles:
    name: Generate and validate npm lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate server lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install server from lockfile
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Audit server production dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build and test server
        working-directory: server
        run: |
          npm run build
          npm test

      - name: Generate dashboard lockfile
        working-directory: dashboard
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dashboard from lockfile
        working-directory: dashboard
        run: npm ci --no-audit --no-fund

      - name: Audit dashboard dependencies
        working-directory: dashboard
        run: npm audit --audit-level=moderate

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json dashboard/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already up to date."
            exit 0
          fi
          git commit -m "chore: add reproducible npm lockfiles"
          git push origin HEAD:main
